<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup Admin — EFASA TEKNIK</title><link rel="stylesheet" href="/assets/admin.css"></head><body class="center-page"><form id="setupForm" class="auth-card"><div class="brand-mark big">E</div><h1>Setup Admin</h1><p>Gunakan halaman ini sekali untuk membuat akun admin pertama.</p><label>Username<input required name="username" minlength="3" maxlength="32"></label><label>Password<input required type="password" name="password" minlength="10"></label><label>Ulangi Password<input required type="password" name="password2" minlength="10"></label><button class="btn primary full-btn">Buat Admin</button><div id="msg" class="msg"></div><a href="/" class="back-link">← Kembali ke website</a></form><script>document.getElementById('setupForm').addEventListener('submit',async function(event){event.preventDefault();var form=Object.fromEntries(new FormData(event.target));var msg=document.getElementById('msg');if(form.password!==form.password2){msg.textContent='Password tidak sama.';return}delete form.password2;try{var r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});var d=await r.json();msg.textContent=d.message||'Selesai';if(d.ok)setTimeout(function(){location.href='/admin/login'},700)}catch(e){msg.textContent=e.message}});</script></body></html>
