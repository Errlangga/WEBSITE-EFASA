<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin — EFASA TEKNIK</title><link rel="stylesheet" href="/assets/admin.css"></head><body class="center-page"><form id="loginForm" class="auth-card"><div class="brand-mark big">E</div><h1>Login Admin</h1><p>Masuk untuk mengelola website EFASA TEKNIK.</p><label>Username<input required name="username" maxlength="32" autocomplete="username"></label><label>Password<input required type="password" name="password" autocomplete="current-password"></label><button class="btn primary full-btn">Masuk</button><div id="msg" class="msg"></div><a href="/" class="back-link">← Kembali ke website</a></form><script>document.getElementById('loginForm').addEventListener('submit',async function(event){event.preventDefault();var form=Object.fromEntries(new FormData(event.target));var msg=document.getElementById('msg');try{var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});var d=await r.json();if(d.ok)location.href='/admin';else msg.textContent=d.message||'Login gagal.'}catch(e){msg.textContent=e.message}});</script></body></html>
